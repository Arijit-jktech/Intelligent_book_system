version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-books_db}
      POSTGRES_USER: ${POSTGRES_USER:-book_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-book_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build: .
    container_name: fastapi_app
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://book_user:book_pass@postgres:5432/books_db
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_MODEL: "llama3"

      # Redis (ElastiCache-compatible)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
