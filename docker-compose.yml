version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-books_db}
      POSTGRES_USER: ${POSTGRES_USER:-book_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-book_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build: .
    container_name: fastapi_app
    depends_on:
      - postgres
      - redis
    environment:
      # All credentials should be loaded from .env file via docker-compose --env-file .env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-book_user}:${POSTGRES_PASSWORD:-book_pass}@postgres:5432/${POSTGRES_DB:-books_db}
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      TOKEN_EXPIRE_HOURS: ${TOKEN_EXPIRE_HOURS:-24}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES:-3}
      OLLAMA_BACKOFF: ${OLLAMA_BACKOFF:-1}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}

    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
